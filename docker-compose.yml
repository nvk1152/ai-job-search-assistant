services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    command: ["-c", "port=2511"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:2511"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
